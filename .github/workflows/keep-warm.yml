name: Keep collab server warm

# Render's free tier sleeps after 15 min of inactivity, which would give the
# evaluator a cold WebSocket. Ping the health endpoint every 10 min to keep it up.
# Set the repo variable COLLAB_SERVER_URL (Settings → Secrets and variables →
# Actions → Variables) to your Render URL, e.g. https://local-first-collab.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.COLLAB_SERVER_URL }}"
          if [ -z "$URL" ]; then
            echo "COLLAB_SERVER_URL not set — skipping keep-warm."
            exit 0
          fi
          curl -fsS "$URL" > /dev/null && echo "Pinged $URL OK"
